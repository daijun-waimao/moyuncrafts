<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魏洲化工 - 长沙魏洲化工有限公司</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f7fa;
            line-height: 1.7;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        /* 头部美化 */
        .header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #e0e0e0;
        }
        .header h1 {
            font-size: 28px;
            color: #1a5276;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 16px;
            color: #666;
        }
        /* 产品卡片美化 */
        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            transition: all 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
        }
        .product-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #f0f5ff;
        }
        .product-info h2 {
            font-size: 20px;
            color: #1a5276;
            margin-bottom: 10px;
        }
        .product-info p {
            font-size: 15px;
            color: #555;
        }
        /* 联系我们模块 */
        .contact-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            padding: 25px;
            margin-top: 30px;
        }
        .contact-section h2 {
            font-size: 22px;
            color: #1a5276;
            margin-bottom: 15px;
            border-left: 4px solid #1a5276;
            padding-left: 10px;
        }
        .contact-item {
            margin: 10px 0;
            font-size: 15px;
            color: #555;
        }
        /* 手机端适配 */
        @media (max-width: 768px) {
            .product-card {
                flex-direction: column;
                text-align: center;
            }
            .product-img {
                width: 100%;
                height: auto;
                max-height: 200px;
            }
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>魏洲化工</h1>
            <p>长沙魏洲化工有限公司 - 专业化工制造与出口商</p>
        </div>

        <div class="product-card">
            <img class="product-img" src="https://raw.githubusercontent.com/daijun-waimao/moyuncrafts/main/jewelry.jpg" alt="亚硫酸钠">
            <div class="product-info">
                <h2>亚硫酸钠</h2>
                <p>应用：采矿、水产养殖、纺织、皮革</p>
                <p>产能：3000吨/月，支持定制包装</p>
            </div>
        </div>

        <div class="product-card">
            <img class="product-img" src="https://raw.githubusercontent.com/daijun-waimao/moyuncrafts/main/decoration.jpg" alt="硫代硫酸钠">
            <div class="product-info">
                <h2>硫代硫酸钠</h2>
                <p>应用：水处理、摄影、水产养殖</p>
                <p>高纯度工业级/食品级，品质稳定</p>
            </div>
        </div>

        <div class="product-card">
            <img class="product-img" src="https://raw.githubusercontent.com/daijun-waimao/moyuncrafts/main/jewelry.jpg" alt="亚硫酸钠（造纸级）">
            <div class="product-info">
                <h2>亚硫酸钠（造纸级）</h2>
                <p>应用：造纸、采矿、水处理</p>
                <p>专业级纯度，适配多种工业场景</p>
            </div>
        </div>

        <div class="product-card">
            <img class="product-img" src="https://raw.githubusercontent.com/daijun-waimao/moyuncrafts/main/decoration.jpg" alt="碳酸亚铁">
            <div class="product-info">
                <h2>碳酸亚铁</h2>
                <p>应用：饲料添加剂、石油钻探</p>
                <p>高含量、低杂质，满足行业标准</p>
            </div>
        </div>

        <div class="contact-section">
            <h2>联系我们</h2>
            <div class="contact-item"><strong>电话：</strong>0086-731-85573222</div>
            <div class="contact-item"><strong>手机：</strong>0086-13808425018</div>
            <div class="contact-item"><strong>邮箱：</strong>info@weichuangchem.com</div>
            <div class="contact-item"><strong>网址：</strong>www.weichuangchem.com</div>
        </div>
    </div>
</body>
</html>
